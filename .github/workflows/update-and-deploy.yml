name: Refresh content and deploy

on:
  schedule:
    # 每 3 天 03:00 UTC 巡检官方更新；可按需修改时区
    - cron: '0 3 */3 * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
      - 'site/data/**'
      - 'reports/**'
      - 'dist/**'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Crawl official sources
        run: node scripts/crawl.mjs
      - name: Build static site
        run: node scripts/build.mjs
        env:
          SITE_BASE_PATH: ${{ endsWith(github.event.repository.name, '.github.io') && '' || format('/{0}/', github.event.repository.name) }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ endsWith(github.event.repository.name, '.github.io') && '' || github.event.repository.name }}
      - name: Commit refreshed data
        run: |
          git config user.name 'dsh-academy-bot'
          git config user.email 'dsh-academy-bot@users.noreply.github.com'
          git add data/state.json site/data reports
          git commit -m 'chore: refresh content [skip ci]' || echo 'no changes'
          git push origin HEAD:${{ github.event.repository.default_branch }} || echo 'nothing to push'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
